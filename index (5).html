<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>منشئ الأسئلة الامتحانية – اللغة العربية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Amiri:wght@400;700&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d2b3a;--bg:#eef0ea;--card:#fff;--line:#cfd4c8;--acc:#0f6b5c;--acc2:#b8472a;--hc:#000;--ff:'Amiri',serif;--fs:18px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo',Tahoma,sans-serif}
button,select,input{font-family:inherit;font-size:14px}
#top{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#top h1{font-size:16px;margin:0 0 0 12px}
.b{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:6px;padding:5px 10px;cursor:pointer;min-width:32px}
.b:hover{background:#e3efe9}.b.p{background:var(--acc);color:#fff;border-color:var(--acc)}.b.d{color:var(--acc2)}
#top .b{border-color:transparent}
#st{margin-inline-start:auto;font-size:13px;opacity:.8}
#tools{position:sticky;top:48px;z-index:19;background:#fff;border-bottom:1px solid var(--line);padding:6px 12px;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
#tools label{font-size:12px;display:flex;align-items:center;gap:3px}
#tools input[type=color]{width:30px;height:28px;padding:0;border:1px solid var(--line);background:none}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
#wrap{display:grid;grid-template-columns:260px 1fr;gap:16px;padding:16px;max-width:1200px;margin:auto;align-items:start}
@media(max-width:850px){#wrap{grid-template-columns:1fr}}
#side{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:8px}
#side h3{margin:4px 0;font-size:15px;color:var(--acc)}
#side label{display:grid;gap:3px;font-size:13px}
#side input,#side select{padding:5px;border:1px solid var(--line);border-radius:5px;width:100%}
.tp{display:grid;grid-template-columns:1fr 1fr;gap:5px}
#paper{color:#000;background:#fff;border:1px solid var(--line);box-shadow:0 2px 10px #0002;padding:16mm 14mm;min-height:297mm;font-family:var(--ff);font-size:var(--fs);line-height:1.9}
#paper.frame{outline:2px solid var(--hc);outline-offset:-8px}
.hd{border:2px solid var(--hc);border-radius:6px;padding:8px 12px;margin-bottom:12px}
.hd .r{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hd .ttl{text-align:center;font-weight:700;font-size:1.15em;color:var(--hc);border-bottom:1px dashed var(--hc);margin:4px 0}
.hd [data-k]{outline:none;min-width:40px;display:inline-block;border-bottom:1px dotted #aaa}
.stu{display:flex;justify-content:space-between;margin-top:6px;gap:10px;flex-wrap:wrap}
.q{position:relative;margin:14px 0;padding:6px 0;border-top:1px solid transparent}
.qh{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--hc);border-bottom:2px solid var(--hc);padding-bottom:2px}
.qh .t{flex:1;outline:none;min-width:60px}
.qh .dg{white-space:nowrap}
.qh .dg input{width:52px;text-align:center;border:1px solid var(--line);border-radius:4px;font:inherit}
.qb{outline:none;min-height:60px;padding:6px 2px}
.qb:focus{background:#f7fbf9}
.ctl{position:absolute;left:0;top:-14px;display:flex;gap:3px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:2px;font-family:'Cairo';font-size:12px}
.ctl .b{padding:1px 6px;font-size:12px}
.qb table,.qb td,.qb th{border:1px solid #333;border-collapse:collapse}
.qb table{width:100%;margin:6px 0}
.qb td,.qb th{padding:4px 8px;min-width:40px}
.qb img{max-width:100%}
.tot{text-align:left;font-weight:700;border-top:2px solid var(--hc);padding-top:4px;margin-top:12px}
.pbl{display:none}
.q.sec{margin:22px 0 6px}.sec .st{display:block;text-align:center;font-weight:700;font-size:1.2em;background:#e8e8e8;border:2px solid #000;padding:2px 10px;border-radius:4px;outline:none}
.qb td,.qb th{height:30px}
.q.pb .pbl{display:block;text-align:center;color:var(--acc2);font:12px 'Cairo';border-top:2px dashed var(--acc2)}
#lib{border:1px solid var(--line);border-radius:10px;padding:14px;width:min(520px,92vw);font-family:'Cairo'}
#lib::backdrop{background:#0006}
.li{display:flex;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.li span{flex:1}
@media print{
 #top,#tools,#side,.ctl,.pbl{display:none!important}
 body{background:#fff}#wrap{display:block;padding:0}
 #paper{border:0;box-shadow:none;padding:0;min-height:0}
 .q.pb{page-break-before:always}.q{page-break-inside:avoid}
 .qh .dg input{border:0}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 @page{size:A4;margin:12mm}
}
</style>
</head>
<body>
<div id="top">
 <h1>📝 منشئ الأسئلة – اللغة العربية</h1>
 <button class="b p" onclick="saveNow()">💾 حفظ</button>
 <button class="b" onclick="newEx()">➕ امتحان جديد</button>
 <button class="b" onclick="dupEx()">⧉ نسخ كنموذج</button>
 <button class="b" onclick="openLib()">📚 مكتبتي</button>
 <button class="b" onclick="expJSON()">⬇ نسخة احتياطية</button>
 <button class="b" onclick="$('#imp').click()">⬆ استيراد</button>
 <button class="b" onclick="toWord()">📄 تصدير Word</button>
 <button class="b" onclick="window.print()">🖨 طباعة</button>
 <input type="file" id="imp" accept=".json" hidden>
 <span id="st"></span>
</div>

<div id="tools">
 <button class="b" onmousedown="event.preventDefault()" onclick="ex('bold')"><b>B</b></button>
 <button class="b" onmousedown="event.preventDefault()" onclick="ex('italic')"><i>I</i></button>
 <button class="b" onmousedown="event.preventDefault()" onclick="ex('underline')"><u>U</u></button>
 <select id="fsz" onchange="fs(this.value)" title="حجم الخط"><option value="">الحجم</option><option>14</option><option>16</option><option>18</option><option>20</option><option>24</option><option>28</option><option>36</option></select>
 <label>لون الخط<input type="color" id="fc" value="#c0392b" oninput="col('foreColor',this.value)"></label>
 <label>تظليل<input type="color" id="bc" value="#fff2a8" oninput="col('hiliteColor',this.value)"></label>
 <span class="sep"></span>
 <button class="b" onmousedown="event.preventDefault()" onclick="ex('justifyRight')">⇥</button>
 <button class="b" onmousedown="event.preventDefault()" onclick="ex('justifyCenter')">≡</button>
 <button class="b" onmousedown="event.preventDefault()" onclick="ex('justifyLeft')">⇤</button>
 <button class="b" onmousedown="event.preventDefault()" onclick="ex('insertUnorderedList')">• قائمة</button>
 <button class="b" onmousedown="event.preventDefault()" onclick="ex('insertOrderedList')">1. قائمة</button>
 <span class="sep"></span>
 <button class="b" onmousedown="event.preventDefault()" onclick="insTable()">▦ جدول</button>
 <button class="b" onmousedown="event.preventDefault()" onclick="tbl('addRow')">+ صف</button>
 <button class="b" onmousedown="event.preventDefault()" onclick="tbl('addCol')">+ عمود</button>
 <button class="b d" onmousedown="event.preventDefault()" onclick="tbl('delRow')">− صف</button>
 <button class="b d" onmousedown="event.preventDefault()" onclick="tbl('delCol')">− عمود</button>
 <label>لون الخلية<input type="color" id="cc" value="#dff1ea" oninput="tbl('bg',this.value)"></label>
 <span class="sep"></span>
 <button class="b" onclick="$('#img').click()">🖼 صورة</button>
 <input type="file" id="img" accept="image/*" hidden>
 <select id="tpl" onchange="insTpl(this.value);this.value=''"><option value="">＋ قالب جاهز</option>
  <option value="blank">املأ الفراغ</option><option value="tf">صح / خطأ</option><option value="mcq">اختيار من متعدد</option>
  <option value="match">صل بخط (جدول)</option><option value="irab">أعرب ما تحته خط</option><option value="free">سؤال مقالي</option><option value="lines">أسطر فارغة</option></select>
</div>

<div id="wrap">
 <aside id="side">
  <h3>معلومات الامتحان</h3>
  <label>عنوان الامتحان (السطر الأول)<input id="m_line"></label>
  <label>لون الإطار والعناوين<input type="color" id="m_hc" value="#000000"></label>
  <label>نوع الخط<select id="m_ff"><option value="Amiri">أميري</option><option value="Cairo">القاهرة</option><option value="Tajawal">تجوال</option><option value="Arial">Arial</option></select></label>
  <label>حجم خط الورقة (px)<input type="number" id="m_fs" min="12" max="30" value="18"></label>
  <label><span><input type="checkbox" id="m_fr" style="width:auto"> إطار حول الورقة</span></label>
  <label><span><input type="checkbox" id="m_st" style="width:auto"> سطر بيانات الطالب</span></label>
  <label><span><input type="checkbox" id="m_fl" style="width:auto"> ترويسة كاملة (مدرسة، تاريخ، زمن)</span></label>
  <h3>الأسئلة</h3>
  <button class="b p" onclick="addSec()">＋ إضافة فرع (أ / ب)</button>
  <button class="b p" onclick="addQ()">＋ إضافة سؤال</button>
  <p style="font-size:12px;margin:0">انقر داخل أي سؤال للكتابة. الصق نصاً من Word أو الإنترنت وسيُنقّى تلقائياً. الحفظ تلقائي في متصفحك.</p>
 </aside>
 <main id="paper"></main>
</div>

<dialog id="lib"><h3 style="margin-top:0">📚 الامتحانات المحفوظة</h3><div id="ll"></div><div style="text-align:left;margin-top:10px"><button class="b" onclick="$('#lib').close()">إغلاق</button></div></dialog>

<script>
const $=s=>document.querySelector(s);
const ORD=['الأول','الثاني','الثالث','الرابع','الخامس','السادس','السابع','الثامن','التاسع','العاشر','الحادي عشر','الثاني عشر'];
const TPL={
blank:'<p>أكمل الفراغات الآتية بما يناسبها:</p><ol><li>جمع كلمة (كتاب) هو ............</li><li>مضارع الفعل (كتبَ) هو ............</li><li>ضدّ كلمة (قويّ) هي ............</li></ol>',
tf:'<p>ضع علامة (✓) أمام العبارة الصحيحة وعلامة (✗) أمام العبارة الخاطئة:</p><ol><li>الفاعل اسم مرفوع. ( &nbsp; )</li><li>الفعل الماضي يدل على حدث مستقبلي. ( &nbsp; )</li><li>الجملة الاسمية تبدأ باسم. ( &nbsp; )</li></ol>',
mcq:'<p>اختر الإجابة الصحيحة:</p><ol><li>المبتدأ في الجملة الاسمية يكون:<br>أ) منصوباً &nbsp;&nbsp; ب) مرفوعاً &nbsp;&nbsp; ج) مجروراً &nbsp;&nbsp; د) مجزوماً</li><li>جمع كلمة (قلم) هو:<br>أ) أقلام &nbsp;&nbsp; ب) قلمات &nbsp;&nbsp; ج) قلوم &nbsp;&nbsp; د) قلمين</li></ol>',
match:'<p>صِل بخط بين العمود (أ) وما يناسبه في العمود (ب):</p><table><tr><th style="background:#eee">أ</th><th style="background:#eee">ب</th></tr><tr><td>الفاعل</td><td>اسم مجرور</td></tr><tr><td>المفعول به</td><td>اسم مرفوع</td></tr><tr><td>المضاف إليه</td><td>اسم منصوب</td></tr></table>',
irab:'<p>أعرب ما تحته خط في الجملة الآتية:</p><p style="text-align:center">قرأَ <u>الطالبُ</u> الدرسَ</p><p>........................................................................</p>',
free:'<p>اكتب موضوعاً لا يقل عن ثمانية أسطر عن: (........................)</p>'+Array(5).fill('<p>................................................................................</p>').join(''),
lines:Array(4).fill('<p>................................................................................</p>').join('')
};
const uid=()=>Math.random().toString(36).slice(2,9);
const D=n=>'.'.repeat(n),ln=(t,n=70)=>`<p>${t?t+' ':''}${D(n)}</p>`;
const tb=(h,rows)=>'<table><tr>'+h.map(x=>`<th style="background:#eee">${x}</th>`).join('')+'</tr>'+rows.map(r=>'<tr>'+h.map((_,i)=>`<td style="height:34px">${r[i]||'&nbsp;'}</td>`).join('')+'</tr>').join('')+'</table>';
function newExam(){const Q=(title,html)=>({id:uid(),title,deg:10,brk:false,html});
return{v:2,id:uid(),meta:{line:'اللغة العربية للثالث متوسط – الامتحان الشهري الأول',full:false,school:'اسم المدرسة',gov:'وزارة التربية',subject:'اللغة العربية',cls:'الثالث المتوسط',date:'التاريخ: ....../....../......',time:'الزمن: ساعتان',teacher:'مدرس المادة: ........',hc:'#000000',ff:'Amiri',fs:18,fr:false,st:false},
qs:[{id:uid(),type:'sec',title:'فرع (أ): القواعد'},
Q('زن الكلمات الآتية مبيناً الأحرف المحذوفة:',tb(['الكلمة','الوزن','الأحرف المحذوفة'],[['سلْ'],['أبع'],['قم'],['قف'],['ثقة']])),
Q('',`<p><b>أ)</b> رُدَّ الأفعال الآتية إلى أبوابها:</p><p>وعد : ${D(25)} &nbsp;&nbsp;&nbsp;&nbsp; نصر : ${D(25)}</p><p><b>ب)</b> صغ من الفعل المضارع فعل أمر:</p><p>يسمو : ${D(25)} &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; دام : ${D(25)}</p><p>يرضى : ${D(25)}</p>`),
Q('',`<p><b>أ)</b> مثّل بجملة لمصدر يدل على حلية.</p>${ln('')}<p><b>ب)</b> هات مصادر الأفعال الآتية مبيناً سبب ورودها على هذا الوزن:</p>${ln('مرؤ :',55)}${ln('نبُه :',55)}${ln('زرق :',55)}`),
{id:uid(),type:'sec',title:'فرع (ب): الأدب'},
Q('ماذا تلمس من قصيدة أحمد شوقي؟',ln('')+ln('')),
Q('',`<p><b>أ)</b> أكمل الأبيات الآتية:</p>${ln('العرش',60)}${ln('نظمت',60)}${ln('بكت',60)}<p><b>ب)</b> ما المدلول اللغوي لما يأتي:</p><p>الأوصاب : ${D(25)} &nbsp;&nbsp;&nbsp; الورس : ${D(25)}</p><p><b>ج)</b> انسب الشعراء الآتية أسماؤهم إلى عصورهم:</p>`+tb(['الشاعر','العصر'],[['محمد سامي البارودي'],['بشار بن برد'],['حسان بن ثابت']])),
Q('',`<p><b>أ)</b> ما معنى كلمة (أدب) في العصر الأموي؟</p>${ln('')}<p><b>ب)</b> عرّف: في سبيل التاج.</p>${ln('')}<p><b>ج)</b> من مؤلفات أحمد شوقي: &nbsp; 1- ${D(18)} &nbsp; 2- ${D(18)} &nbsp; 3- ${D(18)}</p>`)]}}
let S;try{S=JSON.parse(localStorage.getItem('cur')||'null')}catch(e){}
if(!S||S.v!=2)S=newExam();
let savedRange=null,tmr;

/* ---------- حفظ ---------- */
function lib(){try{return JSON.parse(localStorage.getItem('lib')||'{}')}catch(e){return{}}}
function saveNow(){try{const l=lib();S.upd=Date.now();l[S.id]=S;localStorage.setItem('lib',JSON.stringify(l));localStorage.setItem('cur',JSON.stringify(S));$('#st').textContent='✓ تم الحفظ '+new Date().toLocaleTimeString('ar-IQ')}catch(e){$('#st').textContent='⚠ تعذّر الحفظ (الذاكرة ممتلئة؟ احذف الصور الكبيرة)'}}
function dirty(){$('#st').textContent='… تعديلات غير محفوظة';clearTimeout(tmr);tmr=setTimeout(saveNow,700)}
function newEx(){if(confirm('سيتم حفظ الامتحان الحالي وفتح امتحان جديد. متابعة؟')){saveNow();S=newExam();render()}}
function openLib(){const l=lib(),ks=Object.keys(l).sort((a,b)=>l[b].upd-l[a].upd);
 $('#ll').innerHTML=ks.length?ks.map(k=>`<div class="li"><span>${esc(l[k].meta.line||l[k].meta.type||'')}<br><small>${new Date(l[k].upd||0).toLocaleString('ar-IQ')}</small></span><button class="b p" onclick="openEx('${k}')">فتح</button><button class="b d" onclick="delEx('${k}')">حذف</button></div>`).join(''):'<p>لا توجد امتحانات محفوظة.</p>';$('#lib').showModal()}
function openEx(k){S=lib()[k];render();$('#lib').close()}
function delEx(k){if(!confirm('حذف هذا الامتحان نهائياً؟'))return;const l=lib();delete l[k];localStorage.setItem('lib',JSON.stringify(l));openLib()}
function expJSON(){dl(new Blob([JSON.stringify(lib())],{type:'application/json'}),'exams-backup.json')}
$('#imp').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result),l=lib();(d.meta?[d]:Object.values(d)).forEach(x=>{if(x.meta&&x.qs){x.html=0;l[x.id]=x}});localStorage.setItem('lib',JSON.stringify(l));alert('تم الاستيراد إلى المكتبة');openLib()}catch(_){alert('الملف غير صالح')}};r.readAsText(f);e.target.value=''};
function dl(b,n){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),999)}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- العرض ---------- */
function ordName(i){return ORD[i]||('رقم '+(i+1))}
function render(){const m=S.meta,P=$('#paper');S.v=2;m.line=m.line||((m.type||'')+' – '+(m.subject||''));
 document.documentElement.style.setProperty('--hc',m.hc);document.documentElement.style.setProperty('--ff',`'${m.ff}',serif`);document.documentElement.style.setProperty('--fs',m.fs+'px');
 P.classList.toggle('frame',!!m.fr);
 const f=(k)=>`<span data-k="${k}" contenteditable="true">${esc(m[k])}</span>`;
 P.innerHTML=`<div class="hd"><div class="ttl" style="border:0;margin:0;font-size:1.3em">${f('line')}</div>${m.full?`<div class="r"><div>${f('gov')}<br>${f('school')}</div><div style="text-align:left">${f('date')}<br>${f('time')}</div></div><div class="r"><div>${f('subject')} – ${f('cls')} &nbsp; ${f('teacher')}</div><div>مجموع الدرجات: <b id="tt"></b></div></div>`:''}
 ${m.st?'<div class="stu"><span>اسم الطالب: ............................</span><span>الشعبة: ......</span><span>الدرجة: ......... / <span class="tv"></span></span></div>':''}</div>
 <div id="qs"></div><div class="tot">المجموع: <span class="tv"></span> درجة &nbsp;|&nbsp; مع التمنيات بالنجاح</div>`;
 P.querySelectorAll('[data-k]').forEach(e=>e.oninput=()=>{m[e.dataset.k]=e.textContent;if(e.dataset.k=='line')$('#m_line').value=m.line;dirty()});
 const box=$('#qs');
 let n=0;
 S.qs.forEach(q=>{const d=document.createElement('div');d.dataset.id=q.id;d.className='q'+(q.type=='sec'?' sec':'')+(q.brk?' pb':'');
  const ctl=`<div class="pbl">— فاصل صفحة —</div><div class="ctl"><button class="b" title="أعلى" data-a="up">▲</button><button class="b" title="أسفل" data-a="dn">▼</button><button class="b" title="نسخ" data-a="cp">⧉</button><button class="b" title="صفحة جديدة قبله" data-a="pb">⤓ صفحة</button><button class="b d" data-a="rm">✕</button></div>`;
  if(q.type=='sec'){n=0;d.innerHTML=ctl+`<span class="t st" contenteditable="true">${esc(q.title)}</span>`}
  else d.innerHTML=ctl+`<div class="qh"><span>السؤال ${ordName(n++)}:</span><span class="t" contenteditable="true">${esc(q.title)}</span><span class="dg">(<input type="number" min="0" value="${q.deg}"> درجة)</span></div><div class="qb" contenteditable="true">${q.html}</div>`;
  box.appendChild(d)});
 box.oninput=e=>{const d=e.target.closest('.q');if(!d)return;const q=S.qs.find(x=>x.id==d.dataset.id);
  if(e.target.classList.contains('t'))q.title=e.target.textContent;
  else if(e.target.classList.contains('qb'))q.html=e.target.innerHTML;
  else if(e.target.type=='number'){q.deg=+e.target.value||0;sum()}dirty()};
 box.onclick=e=>{const b=e.target.closest('[data-a]');if(!b)return;const id=b.closest('.q').dataset.id,i=S.qs.findIndex(x=>x.id==id),a=b.dataset.a;
  if(a=='up'&&i>0)[S.qs[i-1],S.qs[i]]=[S.qs[i],S.qs[i-1]];
  if(a=='dn'&&i<S.qs.length-1)[S.qs[i+1],S.qs[i]]=[S.qs[i],S.qs[i+1]];
  if(a=='cp')S.qs.splice(i+1,0,{...S.qs[i],id:uid()});
  if(a=='pb')S.qs[i].brk=!S.qs[i].brk;
  if(a=='rm'&&confirm('حذف السؤال؟'))S.qs.splice(i,1);
  render();dirty()};
 box.onpaste=onPaste;
 sum();
 [['m_line','line'],['m_hc','hc'],['m_ff','ff']].forEach(([id,k])=>$('#'+id).value=m[k]);$('#m_fl').checked=!!m.full;$('#m_fs').value=m.fs;$('#m_fr').checked=!!m.fr;$('#m_st').checked=!!m.st}
function sum(){const t=S.qs.reduce((a,q)=>a+(+q.deg||0),0);if($('#tt'))$('#tt').textContent=t;document.querySelectorAll('.tv').forEach(e=>e.textContent=t)}
function addSec(){S.qs.push({id:uid(),type:'sec',title:'فرع جديد'});render();dirty()}
function dupEx(){saveNow();S=JSON.parse(JSON.stringify(S));S.id=uid();S.meta.line+=' (نموذج جديد)';S.qs.forEach(q=>q.id=uid());render();saveNow()}
function addQ(){S.qs.push({id:uid(),title:'',deg:10,brk:false,html:'<p>اكتب السؤال هنا...</p>'});render();dirty();window.scrollTo(0,document.body.scrollHeight)}
['m_line','m_hc','m_ff','m_fs','m_fr','m_st','m_fl'].forEach(id=>$('#'+id).onchange=()=>{const m=S.meta;m.line=$('#m_line').value;m.full=$('#m_fl').checked;m.hc=$('#m_hc').value;m.ff=$('#m_ff').value;m.fs=+$('#m_fs').value||18;m.fr=$('#m_fr').checked;m.st=$('#m_st').checked;render();dirty()});

/* ---------- التحرير ---------- */
document.addEventListener('selectionchange',()=>{const s=getSelection();if(s.rangeCount&&s.anchorNode&&(s.anchorNode.nodeType==1?s.anchorNode:s.anchorNode.parentElement).closest('.qb'))savedRange=s.getRangeAt(0).cloneRange()});
function restore(){if(!savedRange)return false;const s=getSelection();s.removeAllRanges();s.addRange(savedRange);return true}
function inEd(){return restore()}
function ex(c,v){if(!inEd())return alert('انقر داخل نص السؤال أولاً');document.execCommand('styleWithCSS',false,true);document.execCommand(c,false,v);sync()}
function col(c,v){ex(c,v)}
function fs(px){if(!px)return;if(!inEd())return alert('حدّد النص أولاً');document.execCommand('styleWithCSS',false,false);document.execCommand('fontSize',false,7);
 document.querySelectorAll('.qb font[size="7"]').forEach(f=>{const s=document.createElement('span');s.style.fontSize=px+'px';s.innerHTML=f.innerHTML;f.replaceWith(s)});$('#fsz').value='';sync()}
function sync(){const d=savedRange&&savedRange.commonAncestorContainer;const el=d&&(d.nodeType==1?d:d.parentElement).closest('.qb');if(el){const q=S.qs.find(x=>x.id==el.closest('.q').dataset.id);q.html=el.innerHTML;dirty()}}
function insHTML(h){if(!inEd())return alert('انقر داخل نص السؤال أولاً');document.execCommand('insertHTML',false,h);sync()}
function insTable(){const r=+prompt('عدد الصفوف:',3),c=+prompt('عدد الأعمدة:',3);if(!r||!c)return;
 insHTML('<table>'+('<tr>'+'<td>&nbsp;</td>'.repeat(c)+'</tr>').repeat(r)+'</table><p><br></p>')}
function insTpl(k){if(k)insHTML(TPL[k])}
function cell(){if(!restore())return null;const n=getSelection().anchorNode;return n&&(n.nodeType==1?n:n.parentElement).closest('td,th')}
function tbl(a,v){const c=cell();if(!c)return alert('ضع المؤشر داخل خلية في جدول');const tr=c.parentElement,t=c.closest('table'),ci=[...tr.children].indexOf(c);
 if(a=='addRow'){const n=tr.cloneNode(true);n.querySelectorAll('td,th').forEach(x=>x.innerHTML='&nbsp;');tr.after(n)}
 if(a=='addCol')[...t.rows].forEach(r=>{const x=document.createElement('td');x.innerHTML='&nbsp;';r.cells[ci].after(x)});
 if(a=='delRow'){tr.remove();if(!t.rows.length)t.remove()}
 if(a=='delCol'){[...t.rows].forEach(r=>r.cells[ci]&&r.cells[ci].remove());if(!t.rows[0]||!t.rows[0].cells.length)t.remove()}
 if(a=='bg')c.style.backgroundColor=v;sync()}

/* ---------- تنقية اللصق ---------- */
const OK=new Set('B I U STRONG EM P DIV BR SPAN UL OL LI TABLE TBODY THEAD TR TD TH IMG SUB SUP H3'.split(' '));
const SOK=['color','background-color','font-size','font-weight','font-style','text-decoration','text-align'];
function clean(n){[...n.childNodes].forEach(c=>{if(c.nodeType==3)return;if(c.nodeType!=1){c.remove();return}
 const t=c.tagName;if(['SCRIPT','STYLE','META','LINK','IFRAME','OBJECT'].includes(t)){c.remove();return}
 clean(c);if(!OK.has(t)){c.replaceWith(...c.childNodes);return}
 const st=[];SOK.forEach(p=>{const v=c.style.getPropertyValue(p);if(v&&!/url|expression/i.test(v))st.push(p+':'+v)});
 const keep={};['colspan','rowspan'].forEach(a=>{if(c.getAttribute(a))keep[a]=c.getAttribute(a)});
 if(t=='IMG'){const s=c.getAttribute('src')||'';keep.src=/^(data:image|https?:)/.test(s)?s:''}
 [...c.attributes].forEach(a=>c.removeAttribute(a.name));Object.entries(keep).forEach(([k,v])=>c.setAttribute(k,v));
 if(st.length)c.setAttribute('style',st.join(';'));if(t=='IMG'&&!c.src)c.remove()})}
function onPaste(e){if(!e.target.closest||!e.target.closest('.qb'))return;e.preventDefault();const cd=e.clipboardData;
 const f=[...cd.files].find(x=>x.type.startsWith('image/'));if(f)return addImg(f);
 const h=cd.getData('text/html');
 if(h){const d=new DOMParser().parseFromString(h,'text/html');clean(d.body);document.execCommand('insertHTML',false,d.body.innerHTML)}
 else document.execCommand('insertText',false,cd.getData('text/plain'));sync()}
/* ---------- الصور (ضغط) ---------- */
$('#img').onchange=e=>{if(e.target.files[0])addImg(e.target.files[0]);e.target.value=''};
function addImg(f){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,800/im.width),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;
 c.getContext('2d').drawImage(im,0,0,c.width,c.height);insHTML(`<img src="${c.toDataURL('image/jpeg',.75)}" style="max-width:100%">`)};im.src=r.result};r.readAsDataURL(f)}

/* ---------- تصدير Word ---------- */
function toWord(){const m=S.meta,t=S.qs.reduce((a,q)=>a+(+q.deg||0),0);let n=0;
 const body=S.qs.map(q=>{const pb=q.brk?'style="page-break-before:always"':'';
  if(q.type=='sec'){n=0;return `<p ${pb} style="text-align:center;font-weight:bold;font-size:15pt;background:#e8e8e8;border:2px solid #000;margin:16pt 0 6pt">${esc(q.title)}</p>`}
  return `<div ${pb}><p style="font-weight:bold;border-bottom:2px solid #000;margin:12pt 0 4pt">السؤال ${ordName(n++)}: ${esc(q.title)} (${q.deg} درجة)</p>${q.html}</div>`}).join('');
 const full=m.full?`<table><tr><td style="border:0">${esc(m.gov)}<br>${esc(m.school)}</td><td style="border:0;text-align:left">${esc(m.date)}<br>${esc(m.time)}</td></tr><tr><td style="border:0">${esc(m.subject)} – ${esc(m.cls)}</td><td style="border:0;text-align:left">${esc(m.teacher)}</td></tr></table>`:'';
 const h=`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>${esc(m.line)}</title>
<style>@page{size:A4;margin:1.5cm}body{font-family:'${m.ff}','Arial';font-size:${Math.round(m.fs*0.75)}pt;direction:rtl;color:#000}table{border-collapse:collapse;width:100%}td,th{border:1px solid #000;padding:3pt 6pt}</style></head>
<body dir="rtl">${full}<p style="text-align:center;font-weight:bold;font-size:16pt;border:2px solid #000">${esc(m.line)}</p>
${body}<p style="border-top:2px solid #000;font-weight:bold">المجموع: ${t} درجة – مع التمنيات بالنجاح</p></body></html>`;
 dl(new Blob(['\ufeff'+h],{type:'application/msword'}),m.line.replace(/[\s\/\\:]+/g,'_')+'.doc')}

render();saveNow();
</script>
